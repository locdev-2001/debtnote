log_format debtnote '$remote_addr $request_method $status $body_bytes_sent $request_time';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;
  access_log /var/log/nginx/access.log debtnote;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  location ~ ^/(trpc|files)(/|$) {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
    add_header Cache-Control no-store always;
  }
  location = /readyz { proxy_pass http://api:3001; access_log off; }
  location = /healthz { proxy_pass http://api:3001; access_log off; }
  location = /sw.js { add_header Cache-Control 'no-cache'; }
  location = /index.html { add_header Cache-Control 'no-cache'; }
  location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; }
  location / { try_files $uri $uri/ /index.html; }
}
