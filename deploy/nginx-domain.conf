# Chèn vào server HTTPS đã có SSL của debtnote.robertnguyen.io.vn trong aaPanel.
# Thay location / cũ; không tạo thêm server_name trùng.
location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 15m;
    proxy_read_timeout 45s;
}
# Tắt access_log cho /p/ và /trpc/ ở vhost ngoài nếu log format chứa $request_uri.
# Link /p/ là quyền xem riêng, không ghi nguyên link vào access log.
