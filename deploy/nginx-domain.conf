# Chèn vào server HTTPS hiện có của domain trên aaPanel, giữ SSL và listen hiện có.
# Đặt Document Root của website thành đường dẫn dưới đây.
root /www/wwwroot/debtnote.robertnguyen.io.vn/apps/web/dist;
index index.html;
client_max_body_size 15m;
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;

location ~ ^/(trpc|files)(/|$) {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
}
location = /readyz { proxy_pass http://127.0.0.1:3001; access_log off; }
location = /healthz { proxy_pass http://127.0.0.1:3001; access_log off; }
location = /sw.js { add_header Cache-Control no-cache; }
location = /index.html { add_header Cache-Control no-cache; }
location ^~ /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; }
location / { try_files $uri $uri/ /index.html; }
