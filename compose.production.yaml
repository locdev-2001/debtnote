name: debtnote-production
x-application: &application
  image: debtnote-application:${RELEASE_TAG:-local}
  build:
    context: .
    target: application
  env_file: .env.production
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_TRUST_PROXY_HOPS: 1
    DATABASE_URL: postgresql://debtnote:${POSTGRES_PASSWORD:?Cần cấu hình mật khẩu PostgreSQL}@postgres:5432/debtnote
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped
  init: true
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: debtnote
      POSTGRES_USER: debtnote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần cấu hình mật khẩu PostgreSQL}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U debtnote -d debtnote"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *application
    command: [node, apps/api/dist/main.js]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3001/readyz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *application
    command: [node, apps/worker/dist/main.js]
    depends_on:
      api: { condition: service_healthy }
  web:
    image: debtnote-web:${RELEASE_TAG:-local}
    build:
      context: .
      target: web
    ports:
      - 127.0.0.1:18080:80
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres:
  redis:
  uploads:
